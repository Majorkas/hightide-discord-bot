# fly.toml app configuration file generated for hightide-discord-bot on 2026-10-23T22:45:54+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'hightide-discord-bot'
primary_region = 'syd'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATABASE_URL = 'sqlite:////data/hightide.db'
  DEFAULT_TIMEZONE = 'Australia/Perth'

[[mounts]]
  source = 'hightide_data'
  destination = '/data'

[[restart]]
  policy = 'always'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
