app = "hightide-discord-bot"
primary_region = "syd"

[env]
  DATABASE_URL = "sqlite:////data/hightide.db"
  DEFAULT_TIMEZONE = "Australia/Perth"

[build]
  dockerfile = "Dockerfile"

[[restart]]
  policy = "always"

[mounts]
  source = "hightide_data"
  destination = "/data"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
