[project]
name = "hightide-discord-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "SQLAlchemy>=2.0",
    "python-dateutil>=2.9",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
